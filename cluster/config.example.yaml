# EmbedEval on Purdue Scholar's Spark (GB10) nodes.
#
# Copy to cluster/config.yaml (gitignored) and edit what differs for you;
# anything left out takes the value given here. ${USER} and ${SCRATCH} are
# expanded. See docs/running_on_scholar.md.

# The project whose PRs a run handles: zephyr, or nuttx (the unit is then a
# nuttx-apps PR that changes testing/ostest/; see the nuttx section).
project: zephyr

# Everything the cluster scripts create lives under here:
#   <scratch_root>/shared/   reused by every run (images, venvs, the Zephyr clone)
#   <scratch_root>/runs/     one folder per run
scratch_root: /scratch/scholar/${USER}/embedeval

# Where large shared things already are. null means the default under
# <scratch_root>/shared/. Point these at existing copies to reuse them.
paths:
  shared: null              # Python/SDK images, dry-run venvs, uv cache
  zephyr_clone: null        # full bare clone of Zephyr
  models: /scratch/scholar/${USER}/hf/models          # model weights, one folder per model
  vllm_image: /scratch/scholar/${USER}/images/vllm-0.27.1.sif
  vllm_cache: null          # vLLM compile cache; never point it at one used outside
                            # these runs: vLLM writes into the cache it was built in

# The Python versions whose base images setup.py builds (one per Zephyr era).
python_versions: ["3.9", "3.10", "3.12"]

slurm:
  partition: spark-batch
  nodes_min: 2              # submit.py lowers this when fewer nodes are idle
  nodes_max: 16             # never more than this, whatever the work
  time_limit: "03:00:00"    # hard limit; Scholar allows at most 4 hours
  cpus_per_node: 20
  mem: 120500M
  gres: gpu:1
  # NuttX phase jobs (submit.py statement / validate / evaluate) for instances
  # that validate on x86_64 only run on this x86 CPU partition; the GPU
  # partition above runs the ARM64 ones and the model. null: x86 phases
  # cannot be submitted.
  build_partition: null     # e.g. cpu
  build_cpus_per_node: 32
  build_mem: 64G
  # The Python each kind of job runs (a venv with the requirements, of the
  # node's architecture). null: the one submit.py runs with.
  triage_python: null
  build_python: null
  # Directories put first on a phase job's PATH, per kind of job: tools of
  # the node's architecture (e.g. an x86 `gh` where ~/.local/bin holds an
  # ARM one). null: none.
  triage_path: null
  build_path: null

model:
  profile: qwen38-nvfp4     # an entry of triage/models.json

caps:                       # minutes
  server_start: 30          # model server ready
  triage_pr: 30             # one PR's triage
  triage_phase: 95          # all of triage
  build: 45                 # one instance image
  validate_pr: 70           # generate + build + validate, one PR
  validate_phase: 75        # all of validation

parallel:                   # at once
  enrich: 4                 # PRs, on the node running prepare.py (GitHub API)
  dry_run: 8                # PRs, on the node running prepare.py
  triage_per_node: 4        # PRs per model server
  validate_per_node: 4      # builds and validations per node

# NuttX evaluate jobs (submit.py evaluate): an agent (harness/run.py) on each
# VALID instance, its patch graded in a fresh overlay. The same limits for
# every model (the Zephyr and RIOT baseline's on main: 250 steps, 2 hours); they
# are recorded with each result. An evaluate job is job_time_limit long, and its
# phase uses all of it but the report's few minutes (submit.py).
evaluate:
  model: qwen38-nvfp4       # default; submit.py evaluate --model picks one per run
  step_limit: 250
  time_limit: 120           # minutes of agent time per instance; 0: none, the job's end bounds a run
  min_minutes_left: 60      # no new run starts with less of the job left (main's EVAL_MARGIN)
                            # (a run cut off by the job's end is run again, at most twice)
  per_node: 3               # agents at once per node
  job_time_limit: "04:00:00"  # each evaluate job (and its model-server job); Scholar's maximum

disk_guard_gb: 250          # no new builds while the run's instance images exceed this

nuttx:                      # only read when project is nuttx
  individual: null          # frozen triage version to run: a directory holding
                            # scripts/, docs/nuttx_apps_triage.md and triage/ (a GA
                            # snapshot); null means this checkout
  data: null                # pre-warmed candidates/nuttx data (PR records, bare clones);
                            # copied to each node, which then writes only its own copy
  max_tool_calls: 40        # per apps PR
  max_minutes: 30           # per apps PR
  max_repairs: 2            # times an invalid verdict is sent back with its issues
  followup_review: false    # triage_nuttx_prs.py apps --followup-review
  validate: false           # validate accepted pairs (needs the NuttX Apptainer images)
  validate_confidence: [high, medium]   # pair confidences that count as accepted
  determinism: 5            # before-state runs when validating a prepared instance
                            # (prepare.py --instances); promotion needs 5
